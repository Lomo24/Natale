<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buon Natale!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0e121e;
      color: #f5f8ff;
      font-family: system-ui, -apple-system, sans-serif;
      gap: 16px;
      padding: 16px;
    }
    canvas {
      width: min(92vw, 480px);
      height: min(72dvh, 600px);
      border-radius: 16px;
      background: #0e121e;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    button, a.link-btn {
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid #5fa5ff;
      background: #222c44;
      color: #f5f8ff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    button:active, a.link-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <canvas id="treeCanvas" width="540" height="660"></canvas>

  <div class="controls">
    <button id="musicBtn" type="button">Musica: OFF</button>
    <a class="link-btn" href="https://www.youtube.com/results?search_query=Mariah+Carey+All+I+Want+for+Christmas+Is+You" target="_blank" rel="noopener noreferrer">
      Apri brano
    </a>
  </div>

  <audio id="bgAudio" loop preload="auto"></audio>

  <script>
    // Inserisci qui il nome del file audio nella repo (es. "musica.mp3") oppure lascia "" per la melodia sintetica
    const AUDIO_SRC = "";

    const canvas = document.getElementById("treeCanvas");
    const ctx = canvas.getContext("2d");
    const musicBtn = document.getElementById("musicBtn");
    const bgAudio = document.getElementById("bgAudio");

    if (AUDIO_SRC) {
      bgAudio.src = AUDIO_SRC;
    }

    const PALETTE = [
      "rgb(235, 55, 65)",
      "rgb(255, 210, 45)",
      "rgb(45, 215, 235)",
      "rgb(235, 85, 210)",
      "rgb(95, 165, 255)"
    ];

    const ornaments = [];
    let seed = 20261225;
    function rand() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    const count = 42;
    for (let i = 0; i < count; i++) {
      ornaments.push({
        heightRatio: 0.14 + 0.82 * (i / (count - 1)),
        angleOffset: i * 2.3999632,
        radius: 6 + Math.floor(rand() * 5),
        color: PALETTE[i % PALETTE.length]
      });
    }

    let rotationAngle = 0;
    let starAngle = 0;

    function drawStar(cx, cy, outerR, innerR, angle) {
      ctx.save();
      ctx.translate(cx, cy);
      const spinX = Math.max(0.35, Math.abs(Math.cos(angle * 0.7)));
      ctx.rotate(Math.sin(angle) * 0.25);
      ctx.scale(spinX, 1);

      ctx.beginPath();
      const points = 5;
      for (let i = 0; i < points * 2; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const a = -Math.PI / 2 + i * (Math.PI / points) + angle * 0.4;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = "rgb(255, 220, 45)";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgb(255, 245, 150)";
      ctx.stroke();
      ctx.restore();
    }

    function render() {
      rotationAngle += 0.035;
      starAngle += 0.05;

      const w = canvas.width;
      const h = canvas.height;
      const centerX = w / 2;
      const treeTopY = 120;
      const treeBottomY = h - 90;
      const treeHeight = Math.max(180, treeBottomY - treeTopY);
      const maxTreeHalfWidth = Math.min(w / 2 - 55, treeHeight * 0.46);

      ctx.clearRect(0, 0, w, h);

      const trunkW = Math.max(34, maxTreeHalfWidth / 4);
      const trunkH = 48;
      ctx.fillStyle = "rgb(92, 54, 28)";
      ctx.beginPath();
      ctx.roundRect(centerX - trunkW / 2, treeBottomY - 2, trunkW, trunkH, 8);
      ctx.fill();

      const tiers = 16;
      for (let i = 0; i < tiers; i++) {
        const t0 = i / tiers;
        const t1 = (i + 1) / tiers;
        const y0 = treeTopY + t0 * treeHeight;
        const y1 = treeTopY + t1 * treeHeight + 6;
        const wave = Math.sin(rotationAngle * 1.5 + i * 0.65);
        const w0 = t0 * maxTreeHalfWidth * (1 + 0.03 * wave);
        const w1 = t1 * maxTreeHalfWidth * (1 + 0.03 * wave);

        ctx.beginPath();
        ctx.moveTo(centerX - w0, y0);
        ctx.lineTo(centerX + w0, y0);
        ctx.lineTo(centerX + w1, y1);
        ctx.lineTo(centerX - w1, y1);
        ctx.closePath();

        const greenR = 22 + Math.floor(10 * Math.max(0, wave));
        const greenG = 125 + Math.floor(25 * (0.5 + 0.5 * wave));
        const greenB = 48 + Math.floor(8 * Math.max(0, -wave));
        ctx.fillStyle = `rgb(${greenR}, ${greenG}, ${greenB})`;
        ctx.fill();
      }

      for (const o of ornaments) {
        const y = treeTopY + o.heightRatio * treeHeight;
        const coneHalfW = o.heightRatio * maxTreeHalfWidth * 0.92;
        const theta = o.angleOffset + rotationAngle;
        const x3D = Math.cos(theta);
        const z3D = Math.sin(theta);

        if (z3D > -0.15) {
          const depthScale = 0.78 + 0.28 * ((z3D + 0.15) / 1.15);
          const px = centerX + x3D * coneHalfW;
          const py = y;
          const r = Math.max(4, o.radius * depthScale);

          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fillStyle = o.color;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(px - r * 0.35, py - r * 0.35, Math.max(2, r * 0.35), 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
          ctx.fill();
        }
      }

      drawStar(centerX, treeTopY - 38, 28, 12, starAngle);
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // Gestione affidabile ON / OFF con generationId
    let audioCtx = null;
    let musicOn = false;
    let loopTimer = null;
    let playGen = 0;

    const melody = [
      [659.25, 0.35], [659.25, 0.35], [659.25, 0.7],
      [659.25, 0.35], [659.25, 0.35], [659.25, 0.7],
      [659.25, 0.35], [783.99, 0.35], [523.25, 0.45], [587.33, 0.25], [659.25, 0.8]
    ];

    function stopAllAudio() {
      playGen++;
      if (loopTimer !== null) {
        clearTimeout(loopTimer);
        loopTimer = null;
      }
      if (AUDIO_SRC) {
        bgAudio.pause();
      } else if (audioCtx && audioCtx.state === "running") {
        audioCtx.suspend().catch(() => {});
      }
    }

    function playSynthCycle(gen) {
      if (!musicOn || gen !== playGen || !audioCtx || audioCtx.state !== "running") return;

      let t = audioCtx.currentTime + 0.04;
      for (const [freq, dur] of melody) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.08, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
        t += dur + 0.05;
      }

      const waitMs = Math.max(50, (t - audioCtx.currentTime) * 1000);
      loopTimer = setTimeout(() => playSynthCycle(gen), waitMs);
    }

    async function startAllAudio() {
      const gen = ++playGen;
      if (AUDIO_SRC) {
        try {
          await bgAudio.play();
        } catch (err) {
          console.error(err);
        }
        return;
      }

      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }
      if (musicOn && gen === playGen) {
        playSynthCycle(gen);
      }
    }

    musicBtn.addEventListener("click", async () => {
      musicOn = !musicOn;
      if (musicOn) {
        musicBtn.textContent = "Musica: ON";
        await startAllAudio();
      } else {
        musicBtn.textContent = "Musica: OFF";
        stopAllAudio();
      }
    });
  </script>
</body>
</html>
